openapi: 3.1.0
info:
  title: Settlement API
  version: 0.1.0
  description: |
    Period RMESH/ETH settlement statements tied to channel close events (BR-9, BR-12).
  license:
    name: Proprietary
    url: https://hopsettle.local/license
  x-domain: stl
servers:
  - url: https://api.hopsettle.local
security:
  - apiKey: []
tags:
  - name: Settlement
    description: Settlement statements and exports
paths:
  /v1/settlement/statements:
    get:
      operationId: listSettlementStatements
      tags: [Settlement]
      summary: List settlement statements
      parameters:
        - name: period
          in: query
          schema: { type: string }
        - name: meshAttachmentId
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Statements
          content:
            application/json:
              schema:
                $ref: ./settlement.schemas.yaml#/components/schemas/SettlementStatementListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/settlement/statements/{statementId}:
    get:
      operationId: getSettlementStatement
      tags: [Settlement]
      summary: Get a settlement statement with line items
      parameters:
        - name: statementId
          in: path
          required: true
          schema:
            $ref: ./settlement.schemas.yaml#/components/schemas/SettlementStatementId
      responses:
        '200':
          description: Statement
          content:
            application/json:
              schema:
                $ref: ./settlement.schemas.yaml#/components/schemas/SettlementStatementResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/settlement/statements/{statementId}/export:
    post:
      operationId: exportSettlementStatement
      tags: [Settlement]
      summary: Mark statement exported for finance archive
      parameters:
        - name: statementId
          in: path
          required: true
          schema:
            $ref: ./settlement.schemas.yaml#/components/schemas/SettlementStatementId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Exported statement
          content:
            application/json:
              schema:
                $ref: ./settlement.schemas.yaml#/components/schemas/SettlementStatementResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
