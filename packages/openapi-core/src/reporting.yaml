openapi: 3.1.0
info:
  title: Reporting API
  version: 0.1.0
  description: |
    Operator reconciliation and relay attribution exports.
  license:
    name: Proprietary
    url: https://hopsettle.local/license
  x-domain: rpt
servers:
  - url: https://api.hopsettle.local
security:
  - apiKey: []
tags:
  - name: Reporting
    description: Operator reports
paths:
  /v1/reports/channel-reconciliation:
    get:
      operationId: getChannelReconciliationReport
      tags: [Reporting]
      summary: Channel vs accounting reconciliation report
      parameters:
        - name: superpeerId
          in: query
          schema: { type: string }
        - name: meshAttachmentId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Reconciliation report
          content:
            application/json:
              schema:
                $ref: ./reporting.schemas.yaml#/components/schemas/ChannelReconciliationReportResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/reports/relay-attribution:
    get:
      operationId: getRelayAttributionReport
      tags: [Reporting]
      summary: Relay byte attribution for compensation
      parameters:
        - name: meshAttachmentId
          in: query
          schema: { type: string }
        - name: relayMeshId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Relay attribution
          content:
            application/json:
              schema:
                $ref: ./reporting.schemas.yaml#/components/schemas/RelayAttributionReportResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
