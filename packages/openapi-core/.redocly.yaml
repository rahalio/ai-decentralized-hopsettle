apis:
  identity:
    root: src/identity.yaml
  channels:
    root: src/channels.yaml
  accounting:
    root: src/accounting.yaml
  pricing:
    root: src/pricing.yaml
  staking:
    root: src/staking.yaml
  settlement:
    root: src/settlement.yaml
  reporting:
    root: src/reporting.yaml
  disputes:
    root: src/disputes.yaml
  topology:
    root: src/topology.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
